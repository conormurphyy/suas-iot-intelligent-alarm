
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    volumes:
      - ./data/alarm.db:/app/alarm.db
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:latest
    restart: unless-stopped
    expose:
      - "1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
